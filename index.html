</style></head><body><div class="shell"><header class="header"><div class="brand"><div class="logo">м.</div><div><div class="brand-name">можно себе</div><div class="caption">Бюджет, который разрешает жить</div></div></div><div class="header-right"><span class="pill">📍 Данные в этом браузере</span><button class="avatar" onclick="showTab('settings')" aria-label="Настройки">⚙</button></div></header><div id="demo-notice"></div><nav class="desktop-tabs" id="desktop-tabs"></nav><main id="main" aria-live="polite"></main><div class="footer-note">Твои деньги — твои правила. Не банковский сервис, без синхронизации.</div></div><nav class="phone-nav" id="mobile-tabs" aria-label="Навигация"></nav><div id="modal" class="hide"></div>
<script>
'use strict';
const STORE='mozhno-sebe-demo-v1';
const monthNow=()=>new Date().toISOString().slice(0,7);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const n=x=>Number(x)||0;
const money=v=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n(v)))+' ₽';
const signed=(x,prefix=true)=>(n(x)>0?'+':'')+money(x);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const CATS=[{id:'food',name:'Продукты',icon:'🥑',kind:'need',limit:18500},{id:'home',name:'Дом и счета',icon:'🏡',kind:'need',limit:4000},{id:'transport',name:'Транспорт',icon:'🚇',kind:'need',limit:4500},{id:'health',name:'Здоровье',icon:'🧴',kind:'need',limit:3500},{id:'clothes',name:'Одежда',icon:'🧥',kind:'need',limit:5000},{id:'joy',name:'Радости',icon:'🌸',kind:'want',limit:5000},{id:'sport',name:'Спорт',icon:'💪',kind:'want',limit:3500},{id:'other',name:'Прочее',icon:'☕',kind:'want',limit:3500}];
function seed(){const m=monthNow();const day=Math.min(Number(today().slice(8)),22);const mk=(offset)=>m+'-'+String(Math.max(1,day-offset)).padStart(2,'0');return {version:1,isDemo:true,settings:{salary:80000,altSalary:60000,scenario:'main',floor:10000},categories:structuredClone(CATS),accounts:[{id:'card',name:'Карта',icon:'💳',opening:42800},{id:'save',name:'Накопительный',icon:'🪴',opening:40000},{id:'deposit',name:'Вклады',icon:'🏦',opening:143000}],goals:[{id:'phone',icon:'📱',name:'Новый телефон',target:70000,saved:28000,date:'2026-12-31'},{id:'car',icon:'🚘',name:'Машина',target:800000,saved:100000,date:'2028-12-31'},{id:'reserve',icon:'🛟',name:'Запас на смену работы',target:120000,saved:60000,date:'2027-04-01'}],transactions:[{id:uid(),type:'income',amount:80000,account:'card',category:'',note:'Зарплата · пример',date:mk(10)},{id:uid(),type:'expense',amount:7800,account:'card',category:'food',note:'Продукты',date:mk(7)},{id:uid(),type:'expense',amount:2200,account:'card',category:'transport',note:'Метро и такси',date:mk(3)},{id:uid(),type:'expense',amount:2800,account:'card',category:'other',note:'Мелкие покупки',date:mk(2)},{id:uid(),type:'transfer',amount:50000,account:'card',to:'deposit',category:'',note:'На вклад',date:mk(5)},{id:uid(),type:'transfer',amount:15000,account:'card',to:'save',category:'',note:'В копилку',date:mk(5)}]};}
function blank(){let d=seed();d.isDemo=false;d.accounts=d.accounts.map(a=>({...a,opening:0}));d.transactions=[];d.goals=[];return d}
function load(){try{const data=JSON.parse(localStorage.getItem(STORE));if(data&&data.version===1&&Array.isArray(data.accounts)&&Array.isArray(data.transactions)&&Array.isArray(data.goals)&&Array.isArray(data.categories))return data}catch(e){}return seed()}
let S=load();let tab='home';let viewingMonth=monthNow();function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){alert('Не удалось сохранить данные. Экспортируйте резервную копию и проверьте память устройства.')}}
function accBal(id){const a=S.accounts.find(a=>a.id===id);if(!a)return 0;return n(a.opening)+S.transactions.reduce((sum,t)=>sum+(t.type==='income'&&t.account===id?n(t.amount):t.type==='expense'&&t.account===id?-n(t.amount):t.type==='transfer'?(t.to===id?n(t.amount):0)-(t.account===id?n(t.amount):0):0),0)}
const totalAssets=()=>S.accounts.reduce((v,a)=>v+accBal(a.id),0);
const allocated=()=>S.goals.reduce((v,g)=>v+n(g.saved),0);
const spent=(cat,mo=monthNow())=>S.transactions.filter(t=>t.type==='expense'&&t.category===cat&&t.date?.slice(0,7)===mo).reduce((v,t)=>v+n(t.amount),0);
const spentAll=(mo=monthNow())=>S.transactions.filter(t=>t.type==='expense'&&t.date?.slice(0,7)===mo).reduce((v,t)=>v+n(t.amount),0);
const earned=(mo=monthNow())=>S.transactions.filter(t=>t.type==='income'&&t.date?.slice(0,7)===mo).reduce((v,t)=>v+n(t.amount),0);
const salary=()=>S.settings.scenario==='alt'?n(S.settings.altSalary):n(S.settings.salary);
const budgetTotal=()=>S.categories.reduce((v,c)=>v+n(c.limit),0);
const remaining=(kind)=>S.categories.filter(c=>!kind||c.kind===kind).reduce((v,c)=>v+Math.max(0,n(c.limit)-spent(c.id)),0);
const cardBalance=()=>accBal(S.accounts[0]?.id);
const actualAllowed=()=>Math.max(0,Math.min(remaining('want'),cardBalance()-remaining('need')-n(S.settings.floor)));
function goalMonths(date){if(!date)return null;const now=new Date();const end=new Date(date+'T12:00:00');if(!Number.isFinite(end.getTime()))return null;return Math.max(1,Math.ceil((end-now)/(1000*60*60*24*30.44)))}
function goalMonthly(g){let m=goalMonths(g.date);return m?Math.ceil(Math.max(0,n(g.target)-n(g.saved))/m):null}
function goalInfo(g){return `${money(g.saved)} из ${money(g.target)} · ${Math.round(n(g.saved)/Math.max(n(g.target),1)*100)}%`}
function progress(v,max,cls=''){return `<div class="progress" role="progressbar" aria-valuenow="${Math.round(v)}" aria-valuemin="0" aria-valuemax="${Math.round(max)}"><div class="bar ${cls}" style="width:${Math.max(0,Math.min(100,Math.round(v/Math.max(1,max)*100)))}%"></div></div>`}
const navs=[['home','⌂','Обзор'],['transactions','≡','Операции'],['goals','◎','Цели'],['plan','▤','План'],['settings','⚙','Настройки']];
function navbar(){document.getElementById('desktop-tabs').innerHTML=navs.map(([id,ico,name])=>`<button class="tab ${tab===id?'active':''}" onclick="showTab('${id}')">${name}</button>`).join('');document.getElementById('mobile-tabs').innerHTML=navs.map(([id,ico,name])=>id==='transactions'?`<button onclick="openTransaction()" aria-label="Новая операция"><span class="add-circle">+</span>Записать</button>`:`<button class="${tab===id?'active':''}" onclick="showTab('${id}')"><span>${ico}</span>${name}</button>`).join('')}
function header(title,sub,action=''){return `<div class="section-top"><div><div class="eyebrow">${esc(sub)}</div><h1>${esc(title)}</h1></div>${action}</div>`}
function home(){let avail=actualAllowed();const need=remaining('need'),want=remaining('want'),balance=cardBalance();let m=monthNow();return `<section class="hero"><div class="eyebrow">Свободно на желания · ${new Date().toLocaleDateString('ru-RU',{month:'long'})}</div><div class="hero-number">${money(avail)}</div><div class="hero-desc">Это ориентир, сколько можно потратить на приятное, оставив деньги на остальные запланированные расходы и неснижаемый остаток. Не нужно откладывать вообще всё 💚</div><button class="btn light" onclick="openCheck()">✨ А могу себе купить?</button></section>
<div class="grid three gap stats-mobile"><div class="card stat"><div class="label">💳 На основной карте</div><div class="value">${money(balance)}</div><span class="tiny">Доступно физически, не всё свободно</span></div><div class="card stat"><div class="label">🌿 Всего на счетах</div><div class="value">${money(totalAssets())}</div><span class="tiny">Без двойного счёта переводов</span></div><div class="card stat"><div class="label">🧺 На жизнь осталось</div><div class="value">${money(need)}</div><span class="tiny">Незаполненный бюджет необходимости</span></div></div>
<div class="grid gap"><div><div class="card"><div class="row card-head"><h2 class="section-head" style="margin:0">Мой план на месяц</h2><button class="textbtn" onclick="showTab('plan')">Настроить →</button></div><div class="row"><span class="medium muted">Доход по сценарию</span><b>${money(salary())}</b></div><div class="row" style="margin-top:12px"><span class="medium muted">Бюджет расходов</span><b>${money(budgetTotal())}</b></div><div class="row" style="margin-top:12px"><span class="medium muted">Потенциал накоплений</span><b style="color:${salary()-budgetTotal()>=0?'#28684b':'#a94b37'}">${money(salary()-budgetTotal())}</b></div><div class="separator"></div><div class="row"><div><b>А если сменить работу?</b><div class="tiny">Сравни два дохода</div></div><div class="scenario"><button class="${S.settings.scenario==='main'?'selected':''}" onclick="scenario('main')">${Math.round(S.settings.salary/1000)} тыс.</button><button class="${S.settings.scenario==='alt'?'selected':''}" onclick="scenario('alt')">${Math.round(S.settings.altSalary/1000)} тыс.</button></div></div><div class="subbar">Это прогноз при текущих лимитах, а не обещанный доход.</div></div>
<div class="card gap"><div class="row card-head"><h2 class="section-head" style="margin:0">Мои покупки</h2><button class="textbtn" onclick="openCheck()">Проверить →</button></div><div class="medium" style="line-height:1.7">🧥 Куртка и другая необходимая одежда — не «нарушение накоплений». Заложи сумму в отдельную категорию, чтобы видеть, что она уже запланирована.</div><div class="good">Цель бюджета — не только накопить на телефон и машину, но и спокойно жить сейчас.</div></div></div>
<div><div class="card"><div class="row card-head"><h2 class="section-head" style="margin:0">Большие мечты</h2><button class="textbtn" onclick="showTab('goals')">Все цели →</button></div>${S.goals.map(g=>`<div class="goal"><div class="row"><div class="goal-title"><span class="emoji">${esc(g.icon||'✨')}</span>${esc(g.name)}</div><b>${Math.round(g.saved/Math.max(1,g.target)*100)}%</b></div><div class="tiny" style="margin:10px 0">${goalInfo(g)}</div>${progress(g.saved,g.target)}<div class="subbar">${goalMonthly(g)===null?'Без срока':goalMonthly(g)===0?'Цель достигнута':'Для срока: ~'+money(goalMonthly(g))+'/мес.'}</div></div>`).join('')}</div><div class="card gap"><div class="row card-head"><h2 class="section-head" style="margin:0">Последние операции</h2><button class="textbtn" onclick="showTab('transactions')">Смотреть →</button></div>${S.transactions.length?sortedTx().slice(0,4).map(txHtml).join(''):`<div class="empty">Пока пусто. Добавь первую покупку ✨</div>`}</div></div></div>`}
function sortedTx(){return [...S.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function cat(id){return S.categories.find(c=>c.id===id)||{name:'Без категории',icon:'💳'}};
function acname(id){return S.accounts.find(a=>a.id===id)?.name||'Счёт'};
function txHtml(t){let title=t.type==='expense'?cat(t.category).name:t.type==='income'?'Пополнение':'Перевод';let icon=t.type==='expense'?cat(t.category).icon:t.type==='income'?'💵':'↗️';let sign=t.type==='expense'?'-':t.type==='income'?'+':'↔ ';return `<div class="tx"><span class="tx-ico">${icon}</span><div class="info"><strong>${esc(t.note||title)}</strong><small>${esc(t.date)} · ${esc(title)} · ${esc(acname(t.account))}${t.type==='transfer'?' → '+esc(acname(t.to)):''}</small></div><div style="text-align:right"><div class="amount ${t.type==='income'?'pos':'neg'}">${sign}${money(t.amount)}</div><button class="textbtn" onclick="openTransaction('${esc(t.id)}')">Изменить</button></div></div>`}
function txPage(){const old=sortedTx().filter(t=>t.date.slice(0,7)===viewingMonth);return `${header('История денег','Доходы, расходы и переводы',`<button class="btn small" onclick="openTransaction()">+ Добавить</button>`)}<div class="grid three"><div class="card stat"><div class="label">Доходы</div><div class="value pos">${money(earned(viewingMonth))}</div></div><div class="card stat"><div class="label">Расходы</div><div class="value">${money(spentAll(viewingMonth))}</div></div><div class="card stat"><div class="label">Разница</div><div class="value">${money(earned(viewingMonth)-spentAll(viewingMonth))}</div></div></div><div class="card gap"><div class="row card-head"><h2 class="section-head" style="margin:0">Все записи</h2><input style="padding:9px;border:1px solid #ddd;border-radius:12px;max-width:145px" type="month" value="${esc(viewingMonth)}" onchange="viewingMonth=this.value;render()" aria-label="Месяц"></div>${old.length?old.map(txHtml).join(''):`<div class="empty">Нет операций в этом месяце.</div>`}<p class="hint">Переводы между своими счетами не считаются доходами или расходами. Проценты банка записывай как доход на нужный счёт.</p></div>`}
function goalsPage(){return `${header('Коплю, но живу','Цели и запланированные накопления',`<button class="btn small" onclick="openGoal()">+ Новая цель</button>`)}<div class="grid three"><div class="card stat"><div class="label">Всего отложено по целям</div><div class="value">${money(allocated())}</div><div class="tiny">Виртуальное распределение денег</div></div><div class="card stat"><div class="label">На счетах</div><div class="value">${money(totalAssets())}</div><div class="tiny">Фактические остатки по учёту</div></div><div class="card stat"><div class="label">Пока не распределено</div><div class="value">${money(totalAssets()-allocated())}</div><div class="tiny">Может включать деньги на текущие траты</div></div></div><div class="grid gap">${S.goals.map(g=>`<div class="card"><div class="row card-head"><div class="goal-title"><span class="emoji">${esc(g.icon||'✨')}</span>${esc(g.name)}</div><button class="textbtn" onclick="openGoal('${esc(g.id)}')">Изменить</button></div><div class="value">${money(g.saved)} <span class="tiny">/ ${money(g.target)}</span></div>${progress(g.saved,g.target)}<div class="row" style="margin-top:15px"><span class="tiny">${g.date?'До '+esc(g.date):'Без дедлайна'}</span><span class="tiny">${goalMonthly(g)===null?'':goalMonthly(g)===0?'Готово!':'≈ '+money(goalMonthly(g))+'/мес.'}</span></div><div class="shortcut"><button onclick="openGoalAmount('${esc(g.id)}',1000)">+ 1 000 ₽</button><button onclick="openGoalAmount('${esc(g.id)}',5000)">+ 5 000 ₽</button><button onclick="openGoalAmount('${esc(g.id)}',0)">Другая сумма</button></div></div>`).join('')}</div><div class="warn">Важно: «отложено на цель» — это пометка о назначении уже имеющихся денег, не банковский перевод. Когда реально переносишь деньги с карты на вклад, запиши отдельную операцию «Перевод».</div>`}
function planPage(){let diff=salary()-budgetTotal();let goalNeed=S.goals.reduce((v,g)=>v+(goalMonthly(g)||0),0);return `${header('План без крайностей','На месяц · суммы можно менять')}<div class="grid gap"><div><div class="card"><h2 class="section-head">Доход и смена работы</h2><div class="fields"><div class="field"><label>Текущая зарплата, ₽</label><input id="salary-inp" type="number" min="0" step="1000" value="${S.settings.salary}" onchange="setSetting('salary',this.value)"></div><div class="field"><label>Если сменить работу, ₽</label><input type="number" min="0" step="1000" value="${S.settings.altSalary}" onchange="setSetting('altSalary',this.value)"></div></div><div class="row"><b>Сейчас проверяем</b><div class="scenario"><button class="${S.settings.scenario==='main'?'selected':''}" onclick="scenario('main')">${money(S.settings.salary)}</button><button class="${S.settings.scenario==='alt'?'selected':''}" onclick="scenario('alt')">${money(S.settings.altSalary)}</button></div></div><div class="separator"></div><div class="row"><span class="medium muted">Доход</span><b>${money(salary())}</b></div><div class="row" style="margin-top:12px"><span class="medium muted">Все лимиты</span><b>${money(budgetTotal())}</b></div><div class="row" style="margin-top:12px"><span class="medium muted">Останется после бюджета</span><b style="color:${diff>=0?'#31704a':'#b14b38'}">${money(diff)}</b></div>${diff<0?`<div class="warn">План не сходится: расходов запланировано больше доходов на ${money(-diff)}.</div>`:`<div class="good">Если впишешься в лимиты, можно направить до ${money(diff)} на цели и резерв. Это не фактический остаток на счетах.</div>`}<p class="hint">Ориентир для достижения всех целей к указанным датам: ${money(goalNeed)}/мес. Сравни его с возможной суммой накоплений. Сроки и цены условные.</p></div><div class="card gap"><h2 class="section-head">Как расходую деньги</h2>${S.categories.map(c=>{let used=spent(c.id);return `<div class="category"><div class="row"><div class="goal-title"><span>${c.icon}</span>${esc(c.name)} <span class="tag">${c.kind==='need'?'Необходимое':'Хочу'}</span></div><button class="textbtn" onclick="editCategory('${esc(c.id)}')">${money(c.limit)} ✎</button></div><div class="row tiny" style="margin-top:7px"><span>Потрачено ${money(used)}</span><span>Осталось ${money(Math.max(0,c.limit-used))}</span></div>${progress(used,c.limit,used>c.limit?'coral':'')}</div>`}).join('')}</div></div><div><div class="card"><h2 class="section-head">Вписаться в бюджет</h2><p class="medium muted" style="line-height:1.6">Нужны тёплые вещи, хороший телефон, спорт? Это не провал накоплений. Дай каждой важной покупке место в плане.</p><div class="separator"></div><div class="row"><b>На необходимость осталось</b><b>${money(remaining('need'))}</b></div><div class="row" style="margin-top:16px"><b>На желания осталось</b><b>${money(remaining('want'))}</b></div><div class="row" style="margin-top:16px"><b>На карте сверх резерва и обязательных расходов</b><b>${money(Math.max(0,cardBalance()-remaining('need')-S.settings.floor))}</b></div><div class="separator"></div><div class="value" style="color:var(--green)">${money(actualAllowed())}</div><div class="tiny">Ориентир на желания, ограниченный картой и планом</div><button class="btn gap" onclick="openCheck()">Проверить покупку →</button></div><div class="card gap mutedcard"><h2 class="section-head">Запас спокойствия</h2><p class="medium">Деньги, которые хочется оставить нетронутыми на основной карте после прочих расходов.</p><div class="field"><label>Неснижаемый остаток на карте, ₽</label><input type="number" min="0" step="500" value="${S.settings.floor}" onchange="setSetting('floor',this.value)"></div></div></div></div>`}
function settingsPage(){return `${header('Всё под контролем','Счета, сохранение и настройки')}<div class="grid"><div><div class="card"><div class="row card-head"><h2 class="section-head" style="margin:0">Мои счета</h2><button class="textbtn" onclick="openAccount()">+ Добавить</button></div>${S.accounts.map(a=>`<div class="account"><div><div class="row-title">${esc(a.icon||'💳')} ${esc(a.name)}</div><div class="tiny">Расчётный остаток</div></div><div style="text-align:right"><div class="amount">${money(accBal(a.id))}</div><button class="textbtn" onclick="openAccount('${esc(a.id)}')">Изменить</button></div></div>`).join('')}<p class="hint">Начальный остаток + записанные операции = текущий остаток. Если начинаешь учёт сегодня, сначала укажи фактические остатки и затем добавляй новые операции.</p></div><div class="card gap"><h2 class="section-head">Перенос данных</h2><p class="medium muted">Все записи хранятся в браузере на этом устройстве. При очистке данных браузера они могут исчезнуть.</p><div class="shortcut"><button onclick="exportJSON()">⬇ Сохранить копию JSON</button><button onclick="exportCSV()">⬇ Скачать CSV</button><button onclick="document.getElementById('json-import').click()">⬆ Восстановить JSON</button></div><input type="file" id="json-import" accept=".json,application/json" class="hide" onchange="importJSON(this.files[0]);this.value=''"> <p class="hint">Резервную копию стоит хранить отдельно. Данные не зашифрованы; никому не отправляй файл с личными финансами без необходимости.</p></div></div><div><div class="card"><h2 class="section-head">О приложении</h2><p class="medium" style="line-height:1.7">«Можно себе» — ранний функциональный прототип. Работает вручную, без подключения банков и без сервера. Подходит для пробного ведения бюджета на одном устройстве.</p><div class="good">✅ Можно записывать операции, планировать расходы, копить на цели и проверять покупки.</div><div class="warn">⚠️ Не готово для хранения единственной копии реальных финансов: нет облачной синхронизации, входа по паролю и автоматических бэкапов.</div><button class="btn outline" onclick="resetToBlank()">Начать с чистого листа</button><div style="height:9px"></div><button class="btn danger" onclick="resetToDemo()">Вернуть демонстрацию</button></div><div class="card gap mutedcard"><h2 class="section-head">Как использовать</h2><p class="medium">1. Установи начальные остатки на счетах.<br>2. Настрой лимиты на месяц.<br>3. Задай цели и сроки.<br>4. Записывай расходы и переводы.<br>5. Раз в неделю сохраняй резервную копию.</p></div></div></div>`}
function render(){document.getElementById('demo-notice').innerHTML=S.isDemo?`<div class="demo-notice"><span>🧪 Демо: все суммы, счета и операции вымышлены, это НЕ данные из голосовых.</span><button onclick="resetToBlank()">Мои финансы →</button></div>`:'';navbar();document.getElementById('main').innerHTML=({home,transactions:txPage,goals:goalsPage,plan:planPage,settings:settingsPage})[tab]();}
function showTab(x){tab=x;render();window.scrollTo({top:0,behavior:'smooth'})}function scenario(x){S.settings.scenario=x;save();render()}
function setSetting(key,val){S.settings[key]=Math.max(0,n(val));save();render()}
function modal(title,html,fn){document.getElementById('modal').className='overlay';document.getElementById('modal').innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()" aria-label="Закрыть">×</button></div>${html}</div>`;window._modalFn=fn;}
function closeModal(){document.getElementById('modal').className='hide';document.getElementById('modal').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function opts(arr,selected,fn=x=>x.name){return arr.map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(fn(a))}</option>`).join('')}
function openTransaction(id){let t=S.transactions.find(t=>t.id===id);const edit=!!t;t=t||{type:'expense',amount:'',account:S.accounts[0]?.id,category:'food',to:S.accounts[1]?.id,date:today(),note:''};let html=`<form id="tx-form" onsubmit="submitTransaction(event,'${esc(id||'')}')"><div class="field"><label>Тип операции</label><select name="type" id="tx-type" onchange="typeFields()"><option value="expense" ${t.type==='expense'?'selected':''}>Расход</option><option value="income" ${t.type==='income'?'selected':''}>Доход</option><option value="transfer" ${t.type==='transfer'?'selected':''}>Перевод между своими счетами</option></select></div><div class="field"><label>Сумма, ₽</label><input type="number" name="amount" min="0.01" step="0.01" inputmode="decimal" placeholder="Например, 1900" required value="${esc(t.amount)}"></div><div class="fields"><div class="field"><label id="account-label">Счёт</label><select name="account">${opts(S.accounts,t.account)}</select></div><div class="field" id="to-field"><label>Куда перевести</label><select name="to">${opts(S.accounts,t.to)}</select></div><div class="field" id="cat-field"><label>Категория</label><select name="category">${opts(S.categories,t.category)}</select></div><div class="field"><label>Дата</label><input name="date" type="date" required value="${esc(t.date)}"></div></div><div class="field"><label>Заметка (необязательно)</label><input name="note" type="text" maxlength="100" placeholder="На что потрачено?" value="${esc(t.note)}"></div><div class="dialog-actions">${edit?`<button type="button" class="btn danger" onclick="deleteTransaction('${esc(id)}')">Удалить</button>`:''}<button type="button" class="btn outline" onclick="closeModal()">Отмена</button><button class="btn" type="submit">${edit?'Сохранить':'Добавить'}</button></div></form>`;modal(edit?'Редактировать':'Новая операция',html);typeFields()}
function typeFields(){let t=document.getElementById('tx-type')?.value;if(!t)return;document.getElementById('to-field').classList.toggle('hide',t!=='transfer');document.getElementById('cat-field').classList.toggle('hide',t!=='expense');document.getElementById('account-label').innerText=t==='transfer'?'Откуда':'Счёт'}
function submitTransaction(e,id){e.preventDefault();const f=new FormData(e.target);const obj={id:id||uid(),type:f.get('type'),amount:n(f.get('amount')),account:f.get('account'),to:f.get('to'),category:f.get('category'),note:String(f.get('note')||'').slice(0,100),date:f.get('date')};if(!(obj.amount>0)||!S.accounts.some(a=>a.id===obj.account)){alert('Укажи сумму и счёт.');return}if(obj.type==='transfer'&&(!S.accounts.some(a=>a.id===obj.to)||obj.to===obj.account)){alert('Выбери два разных счёта.');return}if(id)S.transactions=S.transactions.map(t=>t.id===id?obj:t);else S.transactions.push(obj);save();closeModal();render()}
function deleteTransaction(id){if(!confirm('Удалить операцию?'))return;S.transactions=S.transactions.filter(t=>t.id!==id);save();closeModal();render()}
function openGoal(id){let g=S.goals.find(x=>x.id===id)||{name:'',icon:'✨',target:'',saved:0,date:''};let html=`<form onsubmit="submitGoal(event,'${esc(id||'')}')"><div class="fields"><div class="field"><label>Название цели</label><input name="name" required maxlength="45" value="${esc(g.name)}" placeholder="Например, куртка"></div><div class="field"><label>Эмодзи</label><input name="icon" maxlength="4" value="${esc(g.icon)}"></div></div><div class="fields"><div class="field"><label>Сколько нужно, ₽</label><input type="number" min="1" step="1" name="target" required value="${esc(g.target)}"></div><div class="field"><label>Уже отложено, ₽</label><input type="number" min="0" step="1" name="saved" required value="${esc(g.saved)}"></div></div><div class="field"><label>Хочу к дате (можно оставить пустой)</label><input name="date" type="date" value="${esc(g.date)}"></div><p class="hint">Отложенная сумма — пометка, а не перевод в банке. Нельзя отложить больше всех денег на счетах.</p><div class="dialog-actions">${id?`<button class="btn danger" type="button" onclick="deleteGoal('${esc(id)}')">Удалить</button>`:''}<button class="btn outline" type="button" onclick="closeModal()">Отмена</button><button class="btn" type="submit">Сохранить</button></div></form>`;modal('Моя цель',html)}
function submitGoal(e,id){e.preventDefault();const f=new FormData(e.target),target=n(f.get('target')),saved=n(f.get('saved'));if(target<=0||saved<0||saved>target){alert('Проверь сумму цели и накоплений.');return}const other=S.goals.filter(g=>g.id!==id).reduce((v,g)=>v+n(g.saved),0);if(saved+other>totalAssets()+0.01){alert('На цели нельзя распределить больше денег, чем фактически есть на счетах. Сначала добавь остатки или доход.');return}let g={id:id||uid(),name:String(f.get('name')||'').trim().slice(0,45),icon:String(f.get('icon')||'✨'),target,saved,date:f.get('date')||''};if(id)S.goals=S.goals.map(x=>x.id===id?g:x);else S.goals.push(g);save();closeModal();render()}
function deleteGoal(id){if(!confirm('Удалить цель? Денежные операции и счета останутся без изменений.'))return;S.goals=S.goals.filter(g=>g.id!==id);save();closeModal();render()}
function openGoalAmount(id,defaultAmount){const g=S.goals.find(g=>g.id===id);if(!g)return;modal('Пополнить цель',`<form onsubmit="saveGoalAmount(event,'${esc(id)}')"><p class="medium">${esc(g.icon)} ${esc(g.name)} · ${goalInfo(g)}</p><div class="field"><label>Сумма, ₽ (минус — убрать из цели)</label><input name="amount" type="number" required step="1" value="${defaultAmount||''}" placeholder="Введите сумму"></div><p class="hint">Это назначение уже имеющихся денег; не переводит их между картой и вкладом.</p><div class="dialog-actions"><button class="btn outline" type="button" onclick="closeModal()">Отмена</button><button class="btn" type="submit">Сохранить</button></div></form>`)}
function saveGoalAmount(e,id){e.preventDefault();const g=S.goals.find(g=>g.id===id),val=n(new FormData(e.target).get('amount'));if(!g)return;let proposed=g.saved+val;if(proposed<0||proposed>g.target||allocated()-g.saved+proposed>totalAssets()+.01){alert('Сумма должна быть в пределах цели и доступных денег на счетах.');return}g.saved=proposed;save();closeModal();render()}
function editCategory(id){let c=cat(id);modal('Лимит: '+c.name,`<form onsubmit="saveCategory(event,'${esc(id)}')"><div class="field"><label>План на месяц, ₽</label><input name="limit" type="number" required min="0" step="100" value="${c.limit}"></div><div class="field"><label>Это необходимость или желание?</label><select name="kind"><option value="need" ${c.kind==='need'?'selected':''}>Необходимость (продукты, куртка, здоровье)</option><option value="want" ${c.kind==='want'?'selected':''}>Желание (приятные покупки)</option></select></div><div class="dialog-actions"><button type="button" class="btn outline" onclick="closeModal()">Отмена</button><button type="submit" class="btn">Сохранить</button></div></form>`)}function saveCategory(e,id){e.preventDefault();const c=S.categories.find(c=>c.id===id);if(c){const f=new FormData(e.target);c.limit=Math.max(0,n(f.get('limit')));c.kind=f.get('kind')==='need'?'need':'want'}save();closeModal();render()}
function openCheck(){const html=`<form onsubmit="checkPurchase(event)"><p class="medium muted" style="line-height:1.6">Введи цену — посмотрим, вписывается ли покупка в план и останутся ли деньги на необходимое.</p><div class="field"><label>Сколько стоит, ₽</label><input name="price" type="number" min="1" step="1" required placeholder="Например, 5000"></div><div class="field"><label>Для чего покупка</label><select name="category">${S.categories.map(c=>`<option value="${esc(c.id)}" ${c.id==='clothes'?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></div><div class="dialog-actions"><button class="btn outline" onclick="closeModal()" type="button">Отмена</button><button class="btn" type="submit">Посчитать →</button></div></form><div id="check-result" aria-live="polite"></div>`;modal('Могу себе купить?',html)}
function checkPurchase(e){e.preventDefault();const f=new FormData(e.target),price=n(f.get('price')),c=cat(f.get('category'));const remain=n(c.limit)-spent(c.id),card=cardBalance(),liquidity=card-n(S.settings.floor)-remaining('need')+(c.kind==='need'?Math.max(0,n(c.limit)-spent(c.id)):0);let safe=price<=remain&&price<=Math.max(0,liquidity),beyond=price>remain;let msg=safe?`<div class="good"><strong>Да, покупка вписывается в план 💚</strong><br>В категории «${esc(c.name)}» хватит лимита, а на карте останется запас под остальные необходимые расходы и резерв.</div>`:`<div class="warn"><strong>Нужна корректировка плана, а не запрет.</strong><br>${beyond?`В категории «${esc(c.name)}» не хватает ${money(price-Math.max(0,remain))}. `:''}${price>Math.max(0,liquidity)?'На основной карте может не хватить свободных средств с учётом резерва и остальных необходимостей. ':''}Можно перенести покупку, перераспределить лимиты или пополнить карту.</div>`;document.getElementById('check-result').innerHTML=msg+`<p class="hint">Расчёт ориентировочный: не учитывает незаписанные расходы и будущие обязательства. Покупка не списывается автоматически.</p>`}
function openAccount(id){let a=S.accounts.find(a=>a.id===id)||{name:'',icon:'💳',opening:0};let current=id?accBal(id):0;modal('Счёт',`<form onsubmit="saveAccount(event,'${esc(id||'')}')"><div class="fields"><div class="field"><label>Название</label><input name="name" maxlength="35" required value="${esc(a.name)}" placeholder="Карта, вклад…"></div><div class="field"><label>Значок</label><input name="icon" maxlength="4" value="${esc(a.icon)}"></div></div><div class="field"><label>${id?'Текущий остаток, ₽':'Начальный остаток, ₽'}</label><input type="number" name="balance" required step="0.01" value="${id?current:a.opening}"></div><p class="hint">${id?'Изменение остатка пересчитает начальный баланс, не удаляя прошлые операции.':'Добавляй счёт с остатком на день начала учёта.'}</p><div class="dialog-actions">${id?`<button type="button" class="btn danger" onclick="deleteAccount('${esc(id)}')">Удалить</button>`:''}<button class="btn outline" type="button" onclick="closeModal()">Отмена</button><button class="btn" type="submit">Сохранить</button></div></form>`)}
function saveAccount(e,id){e.preventDefault();const f=new FormData(e.target),val=Number(f.get('balance'));if(!Number.isFinite(val)){alert('Некорректный остаток');return}if(id){const a=S.accounts.find(a=>a.id===id);a.opening+=val-accBal(id);a.name=String(f.get('name')).trim().slice(0,35);a.icon=String(f.get('icon')||'💳')}else S.accounts.push({id:uid(),name:String(f.get('name')).trim().slice(0,35),icon:String(f.get('icon')||'💳'),opening:val});save();closeModal();render()}
function deleteAccount(id){if(S.accounts.length<2){alert('Нужно оставить хотя бы один счёт');return}if(S.transactions.some(t=>t.account===id||t.to===id)){alert('У счёта есть операции. Удали или перенеси их перед удалением счёта.');return}if(!confirm('Удалить счёт?'))return;S.accounts=S.accounts.filter(a=>a.id!==id);save();closeModal();render()}
function download(name,body,mime){let blob=new Blob([body],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('mozhno-sebe-backup-'+today()+'.json',JSON.stringify({...S,exportDate:new Date().toISOString()},null,2),'application/json;charset=utf-8')}
function exportCSV(){let h=['Дата','Тип','Сумма','Счёт','Куда','Категория','Примечание'];const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let rows=S.transactions.map(t=>[t.date,t.type,t.amount,acname(t.account),t.to?acname(t.to):'',t.category?cat(t.category).name:'',t.note]);download('mozhno-sebe-operations-'+today()+'.csv','\ufeff'+[h,...rows].map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(file){if(!file)return;try{if(file.size>2e6)throw Error('Слишком большой файл');let obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.accounts)||!Array.isArray(obj.transactions)||!Array.isArray(obj.goals)||!Array.isArray(obj.categories)||!obj.settings||!obj.accounts.length||obj.accounts.length>100||obj.transactions.length>50000)throw Error('Формат копии не поддерживается');if(!confirm('Заменить все данные содержимым резервной копии?'))return;S=obj;save();render();alert('Копия восстановлена')}catch(e){alert('Не удалось импортировать: '+e.message)}}
function resetToBlank(){if(!confirm('Удалить демонстрацию и все текущие записи, чтобы начать с нуля? Если здесь есть важные данные, сначала сохрани копию.'))return;S=blank();save();showTab('settings')}
function resetToDemo(){if(!confirm('Удалить все текущие данные и вернуть демонстрацию?'))return;S=seed();save();showTab('home')}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
